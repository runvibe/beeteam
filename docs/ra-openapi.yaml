openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Bee Team RA — contrato proposto
  version: 0.1.0-draft
  description: "Documento de design, não runtime. Confirmado: perfil único, no máximo um vínculo
    collaborator e um leader por agente, apenas em times diferentes; exatamente um líder por time.
    Cópia cria identidade independente, sem chats/tarefas/histórico/credenciais. Demais políticas
    técnicas são propostas. Mesmo /api/v1, Bearer opaco individual e erro {error,code,details} do
    Kanban. agentId é a identidade referenciada por assigneeId/collaboratorId no Kanban; actorId é
    identidade autenticada mapeada de modo persistente, não livre no body. Somente proprietário
    altera perfil/composição; líder edita metadados do próprio time; próprio agente registra chats e
    consulta retomada, sem editar limites. UI mantém visualização/configuração: copy é pedido
    manual, não autorização para gestão operacional via painel. Modos approval/autonomous
    consultados da política efetiva; granularidade workspace/time continua aberta, sem novo endpoint
    global de configuração. Contexto conversacional é auditoria, não prova de consentimento.
    Configuração de credenciais não é parte destas rotas. Arquivado não significa parado; updatedAt
    não prova execução ao vivo. Sem skills/transcrições, IA embutida ou controle de chats.
    Propostas: ciclos de subordinação rejeitados na composição final, histórico preservado, sem hard
    DELETE de agentes/times. POST idempotente por 24h, token revogado não reaproveita replay.
    If-Match para edição individual; composição usa expectedVersion em cada time. Listas
    offset=0/limit=50 máximo100, total após autorização/filtros; ordenação por allowlist e ID de
    desempate, datas From inclusivas/Before exclusivas. AND entre filtros; só taskIds aceita CSV
    (conjunto explícito). Repetidos/desconhecidos inválidos; IDs fora de escopo não vazam. Status de
    negócio protege também cópia e uploads; recursos arquivados só leitura salvo restauração. Não há
    snapshot entre páginas. Bytes de imagem fora da raiz web; URL externa não é buscada no
    servidor."
servers:
  - url: http://127.0.0.1:8080
    description: Endereço local proposto; não comprova API implementada.
security:
  - AgentBearer: []
paths:
  /api/v1/workspaces/{workspaceId}/agents:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: &a1
          type: string
          format: uuid
    post:
      operationId: createAgent
      summary: Criar perfil único sem vínculo
      description: "Proposta: somente proprietário (credencial administrativa local). A IA não recebe
        automaticamente credencial de proprietário; delegação granular futura ainda não definida. "
      x-authorization: O
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Criar perfil único sem vínculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                id: 10000000-0000-4000-8000-000000000001
                workspaceId: 10000000-0000-4000-8000-000000000010
                name: Carlos
                roleDescription: Engenharia
                workStyle: Objetivo e cuidadoso
                workInstructions: Registrar resultados nas tarefas.
                rules: &a3
                  - Respeitar aprovações na conversa.
                accessLimits: &a4
                  - Usar somente recursos autorizados no harness.
                image: null
                bindings:
                  collaboratorTeamId: null
                  leaderTeamId: null
                archivedAt: null
                version: 1
                createdAt: 2026-10-27T18:00:00Z
                updatedAt: 2026-10-27T18:00:00Z
          headers:
            ETag:
              schema:
                type: string
              description: Versão do recurso retornado; CopyResult usa agente novo.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "URI do recurso criado; referência de chat usa coleção com #id, sem criar GET
                adicional."
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgent"
            example:
              name: Carlos
              roleDescription: Engenharia
    get:
      operationId: listAgents
      summary: Listar agentes
      description: "Proposta: proprietário ou ator autenticado com ra:read no mesmo workspace pode ler
        perfis/times, inclusive arquivados. Isso não concede leitura Kanban ou acesso a referências
        privadas de chats. "
      x-authorization: R
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive; %, _ e barra invertida não são wildcards.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: teamId
          in: query
          required: false
          description: Vínculo atual em qualquer papel ou no role especificado.
          schema: *a1
        - name: role
          in: query
          required: false
          description: Com teamId filtra papel nesse time; sem teamId exige algum vínculo nesse papel.
          schema:
            type: string
            enum:
              - leader
              - collaborator
        - &a7
          name: archived
          in: query
          required: false
          description: "False: ativos; true: arquivados. Lifecycle, não execução."
          schema:
            type: boolean
            default: false
        - name: createdFrom
          in: query
          required: false
          description: Inclusivo; RFC3339 com timezone.
          schema: &a2
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Exclusivo; From deve ser anterior a Before.
          schema: *a2
        - name: updatedFrom
          in: query
          required: false
          description: Inclusivo; RFC3339 com timezone.
          schema: *a2
        - name: updatedBefore
          in: query
          required: false
          description: Exclusivo; From deve ser anterior a Before.
          schema: *a2
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: sortBy
          in: query
          required: false
          description: ""
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: Desempate id na mesma direção.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: Listar agentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
