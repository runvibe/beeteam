          description: Consultar índice de tarefas e resumos do agente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLinkPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Credencial individual provisionada localmente. Servidor resolve ator/workspace e
        consulta papéis atuais; UI recebe somente escopo de leitura.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: ""
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag forte do recurso alvo (agente, time ou referência de chat). Cópia usa versão da
        origem; imagem usa versão do agente.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        examples:
          - '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retry idêntico por 24h retorna resposta original; validar autorização atual antes de replay.
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      required: false
      description: Quantidade de resultados autorizados e filtrados a pular.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
  responses:
    "400":
      description: invalid_request; invalid_composition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: task_write_forbidden, project_admin_required, coordination_context_required,
        coordination_mode_mismatch; ra_write_forbidden, owner_required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: archived_resource, status_in_use, team_in_use, summary_required, task_blocked,
        revision_conflict, idempotency_conflict, duplicate_status; role_cardinality_conflict,
        same_team_roles, leader_required, leadership_cycle, agent_in_use, team_in_use,
        assignment_in_use, archived_resource, composition_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "412":
      description: version_conflict; version_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "413":
      description: payload_too_large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "415":
      description: unsupported_media_type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "428":
      description: version_required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: internal_error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: storage_unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CoordinationContext:
      description: Auditável, não prova criptográfica de consentimento. Modo validado contra política
        efetiva persistida.
      oneOf:
        - type: object
          properties:
            mode:
              const: approval
            conversationRef:
              type: string
              minLength: 1
            approvalRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
            - approvalRef
          additionalProperties: false
        - type: object
          properties:
            mode:
              const: autonomous
            conversationRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
          additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - task_write_forbidden
            - project_admin_required
            - coordination_context_required
            - coordination_mode_mismatch
            - not_found
            - archived_resource
            - status_in_use
            - team_in_use
            - summary_required
            - task_blocked
            - revision_conflict
            - idempotency_conflict
            - duplicate_status
            - version_conflict
            - version_required
            - payload_too_large
            - unsupported_media_type
            - internal_error
            - storage_unavailable
            - invalid_composition
            - ra_write_forbidden
            - owner_required
            - role_cardinality_conflict
            - same_team_roles
            - leader_required
            - leadership_cycle
            - agent_in_use
            - assignment_in_use
            - composition_conflict
        details:
          type: object
          additionalProperties: true
      required:
        - error
        - code
        - details
      additionalProperties: false
    ExternalImage:
      type: object
      properties:
        kind:
          const: external
        url:
          type: string
          format: uri
          pattern: ^https://
      required:
        - kind
        - url
      additionalProperties: false
    UploadedImage:
      type: object
      properties:
        kind:
          const: upload
        imageId: *a1
        mediaType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 5242880
        contentPath:
          type: string
          pattern: ^/api/v1/agents/[^/]+/image/content$
      required:
        - kind
        - imageId
        - mediaType
        - sizeBytes
        - contentPath
      additionalProperties: false
    Image:
      oneOf:
        - $ref: "#/components/schemas/ExternalImage"
        - $ref: "#/components/schemas/UploadedImage"
        - type: "null"
      description: Imagem opcional. URL não é buscada pelo servidor; upload validado por conteúdo. Sem
        geração de IA.
    RoleBindings:
      type: object
      properties:
        collaboratorTeamId: &a9
          type:
            - string
            - "null"
          format: uuid
        leaderTeamId: *a9
      required:
        - collaboratorTeamId
        - leaderTeamId
      additionalProperties: false
      description: No máximo um time por papel; quando ambos não nulos, devem ser diferentes. Inclui
        vínculos em times arquivados.
    Agent:
      type: object
      properties:
        id: *a1
        workspaceId: *a1
        name: &a11
          type: string
          minLength: 1
          maxLength: 200
        roleDescription: &a10
          type: string
          x-maxBytes: 65536
          description: Máximo 64 KiB UTF-8; texto, não transcrição integral.
        workStyle: *a10
        workInstructions: *a10
        rules: &a12
          type: array
          items: *a10
        accessLimits: &a13
          type: array
          items: *a10
        image:
          $ref: "#/components/schemas/Image"
        bindings:
          $ref: "#/components/schemas/RoleBindings"
        archivedAt: &a15
          type:
            - string
            - "null"
          format: date-time
        version: &a14
          type: integer
          minimum: 1
        createdAt: *a2
        updatedAt: *a2
      required:
        - id
        - workspaceId
        - name
        - roleDescription
        - workStyle
        - workInstructions
        - rules
        - accessLimits
        - image
        - bindings
        - archivedAt
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      description: Perfil único por identidade. ArchivedAt é lifecycle cadastral, nunca estado de
        execução. UpdatedAt não prova agente vivo.
    CreateAgent:
      type: object
      properties:
        name: *a11
        roleDescription: *a10
        workStyle: *a10
        workInstructions: *a10
        rules: *a12
        accessLimits: *a13
        image:
          oneOf:
            - $ref: "#/components/schemas/ExternalImage"
            - type: "null"
      required:
        - name
      additionalProperties: false
      description: Campos textuais omitidos viram string vazia, arrays omitidos viram []; image padrão
        null. Sem vínculo inicial, credenciais, skills ou chats.
    PatchAgent:
      type: object
      properties:
        name: *a11
        roleDescription: *a10
        workStyle: *a10
        workInstructions: *a10
        rules: *a12
        accessLimits: *a13
        image:
          oneOf:
            - $ref: "#/components/schemas/ExternalImage"
            - type: "null"
      required: []
      additionalProperties: false
      minProperties: 1
      description: Somente proprietário; não altera papéis, credenciais ou workspace. Omissão preserva;
        null só para image. Regras não substituem permissões reais do harness.
    Archive:
      type: object
      properties:
        archived: &a19
          type: boolean
      required:
        - archived
      additionalProperties: false
    CopyAgent:
      type: object
      properties:
        name: *a11
        targetTeamId: *a1
        expectedTeamVersion: *a14
        coordinationContext:
          $ref: "#/components/schemas/CoordinationContext"
      required:
        - targetTeamId
        - expectedTeamVersion
        - coordinationContext
      additionalProperties: false
      description: Copia perfil para nova identidade ativa e vincula como colaborador no time destino
        ativo. Nome omitido mantém nome original. If-Match da origem. Copia imagem como snapshot
        independente, não chats/tarefas/histórico/tokens. Processo atômico com time destino.
    Team:
      type: object
      properties:
        id: *a1
        workspaceId: *a1
        name: *a11
        purpose: *a10
        context: *a10
        leaderId: *a1
        collaboratorCount:
          type: integer
          minimum: 0
        archivedAt: *a15
        version: *a14
        createdAt: *a2
        updatedAt: *a2
      required:
        - id
        - workspaceId
        - name
        - purpose
        - context
        - leaderId
        - collaboratorCount
        - archivedAt
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      description: Exatamente um líder inclusive quando arquivado; membros paginados em /members.
    CreateTeam:
      type: object
      properties:
        name: *a11
        purpose: *a10
        context: *a10
        leaderId: *a1
        collaboratorIds:
          type: array
          items: *a1
          uniqueItems: true
        coordinationContext:
          $ref: "#/components/schemas/CoordinationContext"
      required:
        - name
        - leaderId
        - coordinationContext
      additionalProperties: false
      description: Líder obrigatório, ativo e elegível. Membros ativos e elegíveis. Todos do mesmo
        workspace. Criar time e vínculos é atômico. Textos omitidos vazios; membros omitidos [].
    PatchTeam:
      type: object
      properties:
        name: *a11
        purpose: *a10
        context: *a10
      required: []
      additionalProperties: false
      minProperties: 1
      description: Proprietário ou líder atual do time. Composição somente por comando atômico separado.
    Member:
      type: object
      properties:
        agentId: *a1
        name: *a11
        role:
          type: string
          enum:
            - leader
            - collaborator
        agentArchivedAt: *a15
      required:
        - agentId
        - name
        - role
        - agentArchivedAt
      additionalProperties: false
      description: Projeção dos vínculos atuais, incluindo o único líder. Ordenação por agentId desempata.
    TeamComposition:
      type: object
      properties:
        teamId: *a1
        expectedVersion: *a14
        leaderId: *a1
        collaboratorIds:
          type: array
          items: *a1
          uniqueItems: true
      required:
        - teamId
        - expectedVersion
        - leaderId
        - collaboratorIds
      additionalProperties: false
      description: Estado final completo de um time alterado. Nunca remove vínculos de times omitidos.
    ChangeComposition:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamComposition"
          minItems: 1
          maxItems: 20
        coordinationContext:
          $ref: "#/components/schemas/CoordinationContext"
      required:
        - teams
        - coordinationContext
      additionalProperties: false
      description: Até 20 times distintos. Transação única valida estado final, versões e cardinalidade
        global (inclusive times omitidos/arquivados). Sem estados intermediários sem líder.
        expectedVersion é precondição por time; não há If-Match agregado.
    CompositionResult:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
      required:
        - teams
      additionalProperties: false
      description: Resumo dos times alterados e novas versões; não é listagem paginada.
    CopyResult:
      type: object
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        targetTeam:
          $ref: "#/components/schemas/Team"
      required:
        - agent
        - targetTeam
      additionalProperties: false
    ChatReference:
      type: object
      properties:
        id: *a1
        agentId: *a1
        harness: &a16
          type: string
          minLength: 1
          maxLength: 100
        externalId: &a17
          type: string
          minLength: 1
          maxLength: 500
        url: &a18
          type:
            - string
            - "null"
          format: uri
          pattern: ^(https?://|codex://)
        label: *a11
        archivedAt: *a15
        version: *a14
        createdByActorId: *a1
        createdAt: *a2
        updatedAt: *a2
      required:
        - id
        - agentId
        - harness
        - externalId
        - url
        - label
        - archivedAt
        - version
        - createdByActorId
        - createdAt
        - updatedAt
      additionalProperties: false
      description: Metadados de referência, não transcrição. Arquivar referência não fecha chat. Nenhum
        campo de live/running.
    CreateChatReference:
      type: object
      properties:
        harness: *a16
        externalId: *a17
        url: *a18
        label: *a11
      required:
        - harness
        - externalId
        - label
      additionalProperties: false
      description: Proprietário ou próprio agente; aponta sessão criada externamente. URL omitida null.
        Não aceita segredos na URL; não resolve/faz fetch do link.
    PatchChatReference:
      type: object
      properties:
        label: *a11
        url: *a18
        archived: *a19
      required: []
      additionalProperties: false
      minProperties: 1
      description: Não muda agentId, harness ou externalId. Identidade externa única por agente
        (harness,externalId).
    ImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          x-maxBytes: 5242880
          description: Imagem PNG/JPEG/WebP validada por bytes, até 5 MiB. Nome não é caminho.
      required:
        - file
      additionalProperties: false
    ActivityLink:
      type: object
      properties:
        taskId: *a1
        projectId: *a1
        teamId: *a1
        parentId: *a9
        title: *a11
        statusId: *a1
        assigneeId: *a9
        isCurrentAssignee: *a19
        lastWorkedAt: *a15
        taskUpdatedAt: *a2
        latestOwnSummaryId: *a9
        taskPath:
          type: string
          pattern: ^/api/v1/tasks/[^/]+$
        summariesPath:
          type: string
          pattern: ^/api/v1/tasks/[^/]+/execution-summaries\?actorId=
      required:
        - taskId
        - projectId
        - teamId
        - parentId
        - title
        - statusId
        - assigneeId
        - isCurrentAssignee
        - lastWorkedAt
        - taskUpdatedAt
        - latestOwnSummaryId
        - taskPath
        - summariesPath
      additionalProperties: false
      description: Projeção sem cópia de Task/resumo. Uma linha por tarefa atribuída atualmente ao agente
        ou com resumo de execução de autoria dele. Não inclui tarefa alheia só por liderança.
        Respeita leitura Kanban antes de total. actorId do link é identidade verificável
        historicamente mapeada ao agente.
    ResumeContext:
      type: object
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        teamContexts:
          type: array
          items:
            type: object
            properties:
              teamId: *a1
              role:
                type: string
                enum:
                  - leader
                  - collaborator
              name: *a11
              purpose: *a10
              context: *a10
            required:
              - teamId
              - role
              - name
              - purpose
              - context
            additionalProperties: false
          maxItems: 2
        activityIndexPath:
          type: string
          pattern: ^/api/v1/agents/[^/]+/activities$
        chatReferencesPath:
          type: string
          pattern: ^/api/v1/agents/[^/]+/chat-references$
        taskIds:
          type: array
          items: *a1
          uniqueItems: true
          maxItems: 20
        generatedAt: *a2
        notice:
          type: string
      required:
        - agent
        - teamContexts
        - activityIndexPath
        - chatReferencesPath
        - taskIds
        - generatedAt
        - notice
      additionalProperties: false
      description: Perfil/instruções e contexto dos até dois times. taskIds é seleção opcional autorizada;
        buscar tarefas/resumos/decisões/entregas pelos endpoints Kanban, não copiar histórico. Não
        inicia chat nem prova execução atual.
    AgentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore: *a19
        nextOffset:
          type:
            - integer
            - "null"
          minimum: 0
      required:
        - items
        - offset
        - limit
        - total
        - hasMore
        - nextOffset
      additionalProperties: false
      description: "Autorização e filtros antes de total/offset/limit. hasMore=offset+items.length<total;
        nextOffset=offset+items.length se houver mais, senão null. Além do total: vazio. Snapshot
        coerente dentro da resposta, não entre chamadas."
    TeamPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore: *a19
        nextOffset:
          type:
            - integer
            - "null"
          minimum: 0
      required:
        - items
        - offset
        - limit
        - total
        - hasMore
        - nextOffset
      additionalProperties: false
      description: "Autorização e filtros antes de total/offset/limit. hasMore=offset+items.length<total;
        nextOffset=offset+items.length se houver mais, senão null. Além do total: vazio. Snapshot
        coerente dentro da resposta, não entre chamadas."
    MemberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore: *a19
        nextOffset:
          type:
            - integer
            - "null"
          minimum: 0
      required:
        - items
        - offset
        - limit
        - total
        - hasMore
        - nextOffset
      additionalProperties: false
      description: "Autorização e filtros antes de total/offset/limit. hasMore=offset+items.length<total;
        nextOffset=offset+items.length se houver mais, senão null. Além do total: vazio. Snapshot
        coerente dentro da resposta, não entre chamadas."
    ChatReferencePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatReference"
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore: *a19
        nextOffset:
          type:
            - integer
            - "null"
          minimum: 0
      required:
        - items
        - offset
        - limit
        - total
        - hasMore
        - nextOffset
      additionalProperties: false
      description: "Autorização e filtros antes de total/offset/limit. hasMore=offset+items.length<total;
        nextOffset=offset+items.length se houver mais, senão null. Além do total: vazio. Snapshot
        coerente dentro da resposta, não entre chamadas."
    ActivityLinkPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLink"
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore: *a19
        nextOffset:
          type:
            - integer
            - "null"
          minimum: 0
      required:
        - items
        - offset
        - limit
        - total
        - hasMore
        - nextOffset
      additionalProperties: false
      description: "Autorização e filtros antes de total/offset/limit. hasMore=offset+items.length<total;
        nextOffset=offset+items.length se houver mais, senão null. Além do total: vazio. Snapshot
