openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Bee Team Kanban — contrato proposto
  version: 0.1.0-draft
  description: Design revisável, não implementado. Todos os paths, schemas, limites, identidade e
    persistência são propostas técnicas. Servidor local; UI de visualização/configuração, gestão
    pelos agentes, aprovações na conversa. Fluxo flexível sem transições obrigatórias. Projeto/time
    e leitura conforme kanban-api-plan.md. Sem CRUD de colaboradores, skills ou transcrições. Campos
    desconhecidos rejeitados. Resumos e eventos transacionais com autor do token, nunca do body.
    Tokens devem ser separados por colaborador. CORS não autentica. Recursos arquivados somente
    leitura, exceto restauração autorizada. Paginação offset (padrão 0) e limit (padrão 50, máximo
    100), com total, hasMore e nextOffset; autorização e filtros antes dos totais. AND entre
    filtros, types CSV com OR interno. Sem snapshot entre chamadas. Textos limitados em bytes UTF-8
    conforme x-maxBytes, não caracteres. Idempotência POST por 24h; alterações de conteúdo
    incrementam versão Task. If-Match identifica entidade alvo. Comentários/planos/resumos
    imutáveis. Configuração de autonomia por workspace/time ainda aberta. Referências
    conversacionais auditam, mas não provam consentimento. REST atual de sistema e MCP ficam fora
    deste contrato Kanban.
servers:
  - url: http://127.0.0.1:8080
    description: Endereço local proposto; não comprova API implementada.
security:
  - AgentBearer: []
paths:
  /api/v1/workspaces/{workspaceId}/projects:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    post:
      operationId: createProject
      summary: Criar projeto
      description: "Somente proprietário do workspace. "
      x-authorization: Owner
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Criar projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreated"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Project.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "Referência URI ao recurso criado. Recursos sem rota de detalhe usam URL da coleção com
                fragmento #UUID; não implica nova rota."
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
    get:
      operationId: listProjects
      summary: Listar projetos
      description: "Leitura: membros dos times participantes no workspace ou proprietário; projeto sem
        times só proprietário. Fora do escopo retorna 404.  Filtros distintos compõem AND; somente
        types aceita múltiplos valores CSV (OR interno). Demais parâmetros são escalares: repetidos
        ou desconhecidos retornam 400. UUID, enum, faixa de datas e números inválidos retornam 400
        invalid_request. Aplicar autorização e filtros antes de total, offset e limit. Ordenação
        estável com desempate id; sem snapshot entre requisições."
      x-authorization: R
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive em name do projeto. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: teamId
          in: query
          required: false
          description: ""
          schema: &a3
            type: string
            format: uuid
        - &a9
          name: archived
          in: query
          required: false
          description: "False: ativos; true: arquivados, inclusive por ancestral arquivado. Aplicado antes do
            total."
          schema:
            type: boolean
            default: false
        - name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: updatedFrom
          in: query
          required: false
          description: Limite inferior inclusivo de updatedAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Limite superior exclusivo de updatedAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - &a1
          $ref: "#/components/parameters/Offset"
        - &a2
          $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Listar projetos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
              examples:
                empty:
                  summary: Nenhum resultado autorizado para os filtros
                  value:
                    items: []
                    offset: 0
                    limit: 50
                    total: 0
                    hasMore: false
                    nextOffset: null
                pastEnd:
                  summary: Offset além do total filtrado
                  value:
                    items: []
                    offset: 100
                    limit: 50
                    total: 7
                    hasMore: false
                    nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Consultar projeto
      description: "Leitura: membros dos times participantes no workspace ou proprietário; projeto sem
        times só proprietário. Fora do escopo retorna 404. "
      x-authorization: R
      x-contract-status: proposed
      parameters: []
      responses:
        "200":
          description: Consultar projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
    patch:
      operationId: updateProject
      summary: Atualizar ou arquivar projeto
      description: Proprietário ou administrador explicitamente delegado do projeto; liderar time não
        concede administração automaticamente. Arquivado bloqueia mutações descendentes. Remover
        time em uso retorna 409; restauração continua permitida.
      x-authorization: P
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Atualizar ou arquivar projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProject"
  /api/v1/projects/{projectId}/statuses:
    parameters:
      - name: projectId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    get:
      operationId: listStatuses
      summary: Listar status ordenados
      description: "Leitura: membros dos times participantes no workspace ou proprietário; projeto sem
        times só proprietário. Fora do escopo retorna 404.  Filtros distintos compõem AND; somente
        types aceita múltiplos valores CSV (OR interno). Demais parâmetros são escalares: repetidos
        ou desconhecidos retornam 400. UUID, enum, faixa de datas e números inválidos retornam 400
        invalid_request. Aplicar autorização e filtros antes de total, offset e limit. Ordenação
        estável com desempate id; sem snapshot entre requisições."
      x-authorization: R
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive em name do status. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: isDone
          in: query
          required: false
          description: ""
          schema: &a4
            type: boolean
        - name: includeArchived
          in: query
          required: false
          description: "False: somente ativos; true: ativos e arquivados."
          schema:
            type: boolean
            default: false
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - position
              - name
            default: position
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - *a1
        - *a2
      responses:
        "200":
          description: Listar status ordenados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusList"
              examples:
                empty:
                  summary: Nenhum resultado autorizado para os filtros
                  value:
                    items: []
                    offset: 0
                    limit: 50
                    total: 0
                    hasMore: false
                    nextOffset: null
                pastEnd:
                  summary: Offset além do total filtrado
                  value:
                    items: []
                    offset: 100
                    limit: 50
                    total: 7
                    hasMore: false
                    nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
    post:
      operationId: createStatus
      summary: Criar status ao fim
      description: Proprietário ou administrador explicitamente delegado do projeto; liderar time não
        concede administração automaticamente. Máximo 50 status ativos; ao menos um ativo não final.
        Nome ativo único sem distinção de caixa/espaços externos.
      x-authorization: P
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Criar status ao fim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Project.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "Referência URI ao recurso criado. Recursos sem rota de detalhe usam URL da coleção com
                fragmento #UUID; não implica nova rota."
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusInput"
  /api/v1/projects/{projectId}/statuses/{statusId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
      - name: statusId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStatus
      summary: Configurar status
      description: "Proprietário ou administrador explicitamente delegado do projeto; liderar time não
        concede administração automaticamente. If-Match do Status. Em uso (inclusive tarefas
        arquivadas): proíbe arquivamento ou mudança isDone."
      x-authorization: P
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Configurar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatus"
  /api/v1/projects/{projectId}/status-order:
    parameters:
      - name: projectId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    put:
      operationId: orderStatuses
      summary: Ordenar todos os status ativos
      description: "Proprietário ou administrador explicitamente delegado do projeto; liderar time não
        concede administração automaticamente. "
      x-authorization: P
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Ordenar todos os status ativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOrderResult"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusOrder"
  /api/v1/projects/{projectId}/board:
    parameters:
      - name: projectId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    get:
      operationId: getBoard
      summary: Consultar quadro
      description: "Leitura R. Projeção sem paginação global: retorna todos os status ativos, inclusive
        colunas vazias, ordenados por position,id asc. Cada coluna contém somente raízes ativas,
        primeiros limitPerColumn cards em position,id asc, offset=0 e seu total filtrado/autorizado.
        Continuar usando listTasks com statusId da coluna, rootOnly=true, archived=false,
        sortBy=position, sortOrder=asc, offset=nextOffset, limit=limitPerColumn e mesmos filtros.
        Sem offset global nem filtro de status que esconda colunas. Filtros distintos compõem AND;
        somente types aceita múltiplos valores CSV (OR interno). Demais parâmetros são escalares:
        repetidos ou desconhecidos retornam 400. UUID, enum, faixa de datas e números inválidos
        retornam 400 invalid_request. Aplicar autorização e filtros antes de total, offset e limit.
        Ordenação estável com desempate id; sem snapshot entre requisições."
      x-authorization: R
      x-contract-status: proposed
      parameters:
        - &a5
          name: title
          in: query
          required: false
          description: Substring literal case-insensitive em title da tarefa. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - &a6
          name: teamId
          in: query
          required: false
          description: ""
          schema: *a3
        - &a7
          name: assigneeId
          in: query
          required: false
          description: Um único responsável atual.
          schema: *a3
        - &a8
          name: blocked
          in: query
          required: false
          description: ""
          schema: *a4
        - &a10
          name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - &a11
          name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - &a12
          name: updatedFrom
          in: query
          required: false
          description: Limite inferior inclusivo de updatedAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - &a13
          name: updatedBefore
          in: query
          required: false
          description: Limite superior exclusivo de updatedAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: limitPerColumn
          in: query
          required: false
          description: Primeiros N cards autorizados/filtrados por coluna. Não pagina nem esconde colunas.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Consultar quadro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
              examples:
                emptyColumn:
                  summary: Coluna preservada sem cards correspondentes aos filtros
                  value:
                    projectId: 00000000-0000-4000-8000-000000000001
                    columns:
                      - status:
                          id: 00000000-0000-4000-8000-000000000002
                          projectId: 00000000-0000-4000-8000-000000000001
                          name: Backlog
                          isDone: false
                          position: 0
                          archivedAt: null
                          version: 1
                        tasks: []
                        offset: 0
                        limit: 20
                        total: 0
                        hasMore: false
                        nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
    get:
      operationId: listTasks
      summary: Listar tarefas e subtarefas
      description: "Leitura: membros dos times participantes no workspace ou proprietário; projeto sem
        times só proprietário. Fora do escopo retorna 404.  Filtros distintos compõem AND; somente
        types aceita múltiplos valores CSV (OR interno). Demais parâmetros são escalares: repetidos
        ou desconhecidos retornam 400. UUID, enum, faixa de datas e números inválidos retornam 400
        invalid_request. Aplicar autorização e filtros antes de total, offset e limit. Ordenação
        estável com desempate id; sem snapshot entre requisições. Sem statusId, sortBy=position
        compara os ranks opacos armazenados e id; para reproduzir uma coluna do quadro, usar
        statusId, rootOnly=true, archived=false, sortBy=position e sortOrder=asc. Filtros por IDs
        devem pertencer ao escopo consultado; não revelar existência fora da leitura."
      x-authorization: R
      x-contract-status: proposed
      parameters:
        - *a5
        - name: statusId
          in: query
          required: false
          description: Um único status pertencente ao projeto.
          schema: *a3
        - *a6
        - *a7
        - name: parentId
          in: query
          required: false
          description: Somente filhos diretos deste pai no projeto.
          schema: *a3
        - name: rootOnly
          in: query
          required: false
          description: True é incompatível com parentId; false sem parentId inclui raízes e subtarefas.
          schema:
            type: boolean
            default: false
        - *a8
        - *a9
        - *a10
        - *a11
        - *a12
        - *a13
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - position
              - createdAt
              - updatedAt
              - title
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - *a1
        - *a2
      responses:
        "200":
          description: Listar tarefas e subtarefas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
              examples:
                empty:
