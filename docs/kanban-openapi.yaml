        - items
        - offset
        - limit
        - total
        - hasMore
        - nextOffset
      additionalProperties: false
      description: "Página autorizada e filtrada. Offset além do total: items=[], hasMore=false,
        nextOffset=null. Total e itens devem usar o mesmo snapshot dentro desta resposta; entre
        requisições não há snapshot."
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - task_write_forbidden
            - project_admin_required
            - coordination_context_required
            - coordination_mode_mismatch
            - not_found
            - archived_resource
            - status_in_use
            - team_in_use
            - summary_required
            - task_blocked
            - revision_conflict
            - idempotency_conflict
            - duplicate_status
            - version_conflict
            - version_required
            - payload_too_large
            - unsupported_media_type
            - internal_error
            - storage_unavailable
        details:
          type: object
          additionalProperties: true
      required:
        - error
        - code
        - details
      additionalProperties: false
