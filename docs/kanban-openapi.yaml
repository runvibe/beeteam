    get:
      operationId: listPlans
      summary: Listar plans
      description: "Leitura: membros dos times participantes no workspace ou proprietário; projeto sem
        times só proprietário. Fora do escopo retorna 404. Planos: lista revisão atual de cada
        planId. Filtros distintos compõem AND; somente types aceita múltiplos valores CSV (OR
        interno). Demais parâmetros são escalares: repetidos ou desconhecidos retornam 400. UUID,
        enum, faixa de datas e números inválidos retornam 400 invalid_request. Aplicar autorização e
        filtros antes de total, offset e limit. Ordenação estável com desempate id; sem snapshot
        entre requisições. Primeiro selecionar a revisão atual de cada planId; depois filtrar por
        autor/data dessa revisão e paginar. Não retornar revisão antiga por corresponder ao filtro."
      x-authorization: R
      x-contract-status: proposed
      parameters:
        - name: title
          in: query
          required: false
          description: Substring literal case-insensitive em title do planejamento. Percentual, underscore e
            barra invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - &a14
          name: actorId
          in: query
          required: false
          description: Filtra autoria já registrada, sem definir a identidade do solicitante.
          schema: *a3
        - name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt da revisão atual, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt da revisão atual, RFC3339 com timezone. From
            deve ser estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - createdAt
              - title
            default: createdAt
        - name: sortOrder
