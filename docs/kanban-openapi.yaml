components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Credencial individual provisionada localmente. Servidor resolve ator/workspace e
        consulta papéis atuais; UI recebe somente escopo de leitura.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag forte da entidade alvo; em comandos de conteúdo, da tarefa; em ordenação de
        status, do projeto.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        examples:
          - '"1"'
    ParentIfMatch:
      name: If-Match
      in: header
      required: false
      description: "Obrigatório se parentId não nulo: ETag do pai. Ausência retorna 428."
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retry idêntico por 24h retorna resposta original; validar autorização atual antes de replay.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Máximo de itens na página; valores fora do intervalo são rejeitados, não truncados.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Quantidade de registros autorizados e filtrados a pular. Offset além do total retorna
        items vazio.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
  responses:
    "400":
      description: invalid_request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: task_write_forbidden, project_admin_required, coordination_context_required,
        coordination_mode_mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: archived_resource, status_in_use, team_in_use, summary_required, task_blocked,
        revision_conflict, idempotency_conflict, duplicate_status
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "412":
      description: version_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "413":
      description: payload_too_large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "415":
      description: unsupported_media_type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "428":
      description: version_required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: internal_error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: storage_unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Progress:
      type: object
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        note:
          type: string
          description: Markdown, máximo 65536 bytes UTF-8.
          x-maxBytes: 65536
      required:
        - percent
        - note
      additionalProperties: false
    Block:
      oneOf:
        - type: object
          properties:
            blocked:
              const: true
            reason:
              type: string
              minLength: 1
              maxLength: 2000
          required:
            - blocked
            - reason
          additionalProperties: false
        - type: object
          properties:
            blocked:
              const: false
            reason:
              type: "null"
          required:
            - blocked
            - reason
          additionalProperties: false
    CoordinationContext:
      description: Auditável, não prova criptográfica de consentimento. Modo validado contra política
        efetiva persistida.
      oneOf:
        - type: object
          properties:
            mode:
              const: approval
            conversationRef:
              type: string
              minLength: 1
            approvalRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
            - approvalRef
          additionalProperties: false
        - type: object
          properties:
            mode:
              const: autonomous
            conversationRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
          additionalProperties: false
    ReviewContext:
      type: object
      properties:
        reviewerType:
          type: string
          enum:
            - user
            - team_leader
        conversationRef:
          type: string
          minLength: 1
        instructionRef:
          type: string
          minLength: 1
      required:
        - reviewerType
        - conversationRef
        - instructionRef
      additionalProperties: false
      description: Orientação de revisão na conversa; não prova consentimento por si só.
    Deliverable:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        attachmentId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          pattern: ^https?://
      required:
        - label
      additionalProperties: false
      not:
        required:
          - attachmentId
          - url
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Markdown, máximo 65536 bytes UTF-8.
          x-maxBytes: 65536
        teamIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - workspaceId
        - name
        - description
        - teamIds
        - archivedAt
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
    Status:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
