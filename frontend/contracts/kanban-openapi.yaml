          description: Ordenar todos os status ativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOrderResult"
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
        "400":
