openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Bee Team Kanban — contrato proposto
  version: 0.1.0-draft
  description: Revisão documental final. Domínio boards, tasks, times e agentes. Board tem um time
    gestor obrigatório e transferível; Task não tem vínculo direto com time. Times agrupam agentes e
    podem gerir vários boards. Board preserva criador declarado; Task tem autor/dono e executor
    agentes obrigatórios, sem task desatribuída. Subtask é Task com parentId recursivo sem limite
    fixo, pode estar em outro board e usar outro executor; ciclos inválidos. Informações de tasks
    disponíveis a todos. Contexto é o board que originou a task principal, preservado por toda a
    cadeia recursiva, mesmo em outros boards. Origem manual força manual; origem automatic força
    automatic; origem standard usa somente autonomyMode da task atual, sem herança da flag do pai.
    Board de destino não interfere. Cálculo não altera configurações persistidas; Bee Team não
    executa tarefas. Sem autenticação, autoria declarada não verificada. Backend Rust/PostgreSQL
    >=18; IDs persistidos UUID v7, referências externas opacas; exclusão lógica deleted_at/JSON
    deletedAt, archivedAt separado. offset/limit e filtros. Harness executa, Bee Team
    armazena/consulta; frontend/backend/skills seguem pausados nesta revisão.
  x-confirmed-decisions:
    - board-creator-preserved
    - task-author-and-executor-required
    - recursive-cross-board-subtasks
    - execution-origin-board-precedence
    - no-auth
    - postgresql>=18
    - persisted-uuidv7
    - soft-delete-deleted_at
    - offset-limit
    - archived-team-explicit-transfer
    - board-managing-team-required-transferable
    - task-no-team-ownership
  x-pending-proposals:
    - leader-edit-scope-via-managed-executor
    - declared-author-header-format
    - reparenting-not-exposed
    - archive-agent-rules
    - planning-revisions-and-payload-limits
servers:
  - url: http://127.0.0.1:59865
    description: Endereço local proposto; não comprova API implementada.
paths:
  /api/v1/tasks/by-slug/{slug}:
    get:
      operationId: resolveTaskSlug
      summary: Resolver slug de Task para UUID interno
      description: Consulta indexada sem enumerar listagens. Retorna identidade canônica;
        buscar detalhes na rota por UUID existente. Arquivados resolvem, excluídos retornam
        404. Não redireciona nem reutiliza slugs.
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: Identidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugResolution'
        '400':
          description: Slug inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identidade não encontrada ou excluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/boards:
    parameters: []
    post:
      operationId: createBoard
      summary: Criar board
      description: Criar board com teamId gestor obrigatório e criador declarado preservado. Um time pode
        gerir vários boards. Tasks não herdam pertencimento a time. autonomyMode inicial manual.
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: Criar board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardCreated"
              example:
                id: 10000000-0000-7000-8000-000000000001
                name: Produto
                description: Board independente
                autonomyMode: manual
                createdBy:
                  actorKind: agent
                  actorId: 10000000-0000-7000-8000-000000000010
                archivedAt: null
                version: 1
                createdAt: 2026-10-27T20:00:00Z
                updatedAt: 2026-10-27T20:00:00Z
                deletedAt: null
                statuses:
                  - id: 10000000-0000-7000-8000-000000000020
                    boardId: 10000000-0000-7000-8000-000000000001
                    name: A fazer
                    isDone: false
                    position: 0
                    archivedAt: null
                    version: 1
                    deletedAt: null
                teamId: 10000000-0000-7000-8000-000000000030
                lastManagementChange: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "Referência URI ao recurso criado. Recursos sem rota de detalhe usam URL da coleção com
                fragmento #UUID; não implica nova rota."
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoard"
            example:
              name: Produto
              autonomyMode: standard
              teamId: 10000000-0000-7000-8000-000000000030
    get:
      operationId: listBoards
      summary: Listar boards
      description: "Filtros distintos compõem AND; somente types aceita múltiplos valores CSV (OR
        interno). Demais parâmetros são escalares: repetidos ou desconhecidos retornam 400. UUID,
        enum, faixa de datas e números inválidos retornam 400 invalid_request. Ordenação estável com
        desempate id; sem snapshot entre requisições."
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive em name do board. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: archived
          in: query
          required: false
          description: "False: ativos; true: arquivados, inclusive por ancestral arquivado. Aplicado antes do
            total."
          schema:
            type: boolean
            default: false
        - name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: updatedFrom
          in: query
          required: false
          description: Limite inferior inclusivo de updatedAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Limite superior exclusivo de updatedAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: teamId
          in: query
          required: false
          schema: &a2
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Filtro por time gestor do board; não representa vínculo da task.
      responses:
        "200":
          description: Listar boards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/boards/{boardId}:
    parameters:
      - name: boardId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    get:
      operationId: getBoard
      summary: Consultar board
      description: ""
      x-contract-status: proposed
      parameters: []
      responses:
        "200":
          description: Consultar board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
              example:
                id: 10000000-0000-7000-8000-000000000001
                name: Produto
                description: Board independente
                autonomyMode: manual
                createdBy:
                  actorKind: agent
                  actorId: 10000000-0000-7000-8000-000000000010
                archivedAt: null
                version: 1
                createdAt: 2026-10-27T20:00:00Z
                updatedAt: 2026-10-27T20:00:00Z
                deletedAt: null
                teamId: 10000000-0000-7000-8000-000000000030
                lastManagementChange: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
    patch:
      operationId: updateBoard
      summary: Atualizar ou arquivar board
      description: Editar metadados, modo e/ou teamId gestor. If-Match do board. Transferência válida
        grava board.management_changed e o novo teamId atomicamente; não altera creator,
        autor/executor das tasks, parentId, originBoardId ou histórico. Enviar teamId atual não gera
        novo evento de transferência.
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Atualizar ou arquivar board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
              example:
                id: 10000000-0000-7000-8000-000000000001
                name: Produto
                description: Board independente
                autonomyMode: manual
                createdBy:
                  actorKind: agent
                  actorId: 10000000-0000-7000-8000-000000000010
                archivedAt: null
                version: 2
                createdAt: 2026-10-27T20:00:00Z
                updatedAt: 2026-10-27T20:01:00Z
                deletedAt: null
                teamId: 10000000-0000-7000-8000-000000000031
                lastManagementChange:
                  id: 10000000-0000-7000-8000-000000000090
                  boardId: 10000000-0000-7000-8000-000000000001
                  type: board.management_changed
                  previousTeamId: 10000000-0000-7000-8000-000000000030
                  teamId: 10000000-0000-7000-8000-000000000031
                  actor:
                    actorKind: human
                    actorId: null
                  occurredAt: 2026-10-27T20:01:00Z
                  deletedAt: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBoard"
            examples:
              transferManagement:
                summary: Transferir gestão mantendo tasks inalteradas
                value:
                  teamId: 10000000-0000-7000-8000-000000000031
  /api/v1/boards/{boardId}/statuses:
    parameters:
      - name: boardId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    get:
      operationId: listStatuses
      summary: Listar status ordenados
      description: "Filtros distintos compõem AND; somente types aceita múltiplos valores CSV (OR
        interno). Demais parâmetros são escalares: repetidos ou desconhecidos retornam 400. UUID,
        enum, faixa de datas e números inválidos retornam 400 invalid_request. Ordenação estável com
        desempate id; sem snapshot entre requisições."
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive em name do status. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: isDone
          in: query
          required: false
          description: ""
          schema:
            type: boolean
        - name: includeArchived
          in: query
          required: false
          description: "False: somente ativos; true: ativos e arquivados."
          schema:
            type: boolean
            default: false
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - position
              - name
            default: position
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Listar status ordenados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusList"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
    post:
      operationId: createStatus
      summary: Criar status ao fim
      description: "Política de uso proposta: usuário configura o board. Contexto declarado, não
        identidade verificada. Máximo 50 status ativos; ao menos um ativo não final. Nome ativo
        único sem distinção de caixa/espaços externos."
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: Criar status ao fim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                id: 10000000-0000-7000-8000-000000000020
                boardId: 10000000-0000-7000-8000-000000000001
                name: A fazer
                isDone: false
                position: 0
                archivedAt: null
                version: 1
                deletedAt: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "Referência URI ao recurso criado. Recursos sem rota de detalhe usam URL da coleção com
                fragmento #UUID; não implica nova rota."
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusInput"
  /api/v1/boards/{boardId}/statuses/{statusId}:
    parameters:
      - name: boardId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      - name: statusId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    patch:
      operationId: updateStatus
      summary: Configurar status
      description: "Política de uso proposta: usuário configura o board. Contexto declarado, não
        identidade verificada. If-Match do Status. Em uso (inclusive tarefas arquivadas): proíbe
        arquivamento ou mudança isDone."
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Configurar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                id: 10000000-0000-7000-8000-000000000020
                boardId: 10000000-0000-7000-8000-000000000001
                name: A fazer
                isDone: false
                position: 0
                archivedAt: null
                version: 1
                deletedAt: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatus"
  /api/v1/boards/{boardId}/status-order:
    parameters:
      - name: boardId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    put:
      operationId: orderStatuses
      summary: Ordenar todos os status ativos
      description: "Política de uso proposta: usuário configura o board. Contexto declarado, não
