      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - coordination_context_required
            - coordination_mode_mismatch
            - not_found
            - archived_resource
            - status_in_use
            - summary_required
            - task_blocked
            - revision_conflict
            - idempotency_conflict
            - duplicate_status
            - version_conflict
            - version_required
            - payload_too_large
            - unsupported_media_type
            - internal_error
            - storage_unavailable
            - invalid_actor_context
            - usage_policy_conflict
            - parent_cycle
            - execution_context_mismatch
        details:
          type: object
          additionalProperties: true
      required:
        - error
        - code
        - details
      additionalProperties: false
    ApprovalCoordinationContext:
      type: object
      properties:
        mode:
          const: manual
        conversationRef:
          type: string
          minLength: 1
        approvalRef:
          type: string
          minLength: 1
      required:
        - mode
        - conversationRef
        - approvalRef
      additionalProperties: false
      description: Sem contexto de execução, aprovação/manual. Não concede autonomia global.
    BoardAutonomyMode:
      type: string
      enum:
        - manual
        - standard
        - automatic
      default: manual
      description: manual = totalmente manual; standard = padrão que respeita flag individual de cada
        task; automatic = totalmente automático. Default inicial manual, distinto do nome standard.
    TaskAutonomyMode:
      type: string
      enum:
        - manual
        - automatic
      default: manual
      description: Modo individual da task, usado apenas se o board de origem do contexto estiver em standard.
    DeclaredActor:
      oneOf:
        - type: object
          properties:
            actorKind:
              const: human
            actorId:
              type: "null"
          required:
            - actorKind
            - actorId
          additionalProperties: false
        - type: object
          properties:
            actorKind:
              const: agent
            actorId: *a1
          required:
            - actorKind
            - actorId
          additionalProperties: false
      description: Criador declarado na requisição. human identifica o usuário local; agent usa ID
        persistido. Não verifica identidade.
    ExecutionContextRef:
      type: object
      properties:
        rootTaskId: *a1
        originBoardId: *a1
      required:
        - rootTaskId
        - originBoardId
      additionalProperties: false
      description: Identifica a origem da cadeia. Persistida/derivada pelo servidor a partir da task
        principal, nunca substituída pelo board de destino.
    TaskExecutionContext:
      type: object
      properties:
        rootTaskId: *a1
        originBoardId: *a1
        originBoardMode:
          $ref: "#/components/schemas/BoardAutonomyMode"
        effectiveMode:
          type: string
          enum:
            - manual
            - automatic
      required:
        - rootTaskId
        - originBoardId
        - originBoardMode
        - effectiveMode
      additionalProperties: false
      readOnly: true
      description: Board de origem da task principal governa toda cadeia recursiva, inclusive cross-board.
        originBoardMode=manual força effectiveMode=manual; automatic força automatic; standard usa
        somente autonomyMode da task atual. Não herdar flag do pai nem consultar modo do board de
        destino. Não modificar configurações persistidas. rootTaskId/originBoardId são derivados da
        cadeia e transportados pelo harness; o servidor não executa tasks.
    BoardManagementChange:
      type: object
      properties:
        id: *a2
        boardId: *a2
        type:
          type: string
          const: board.management_changed
        previousTeamId: *a2
        teamId: *a2
        actor:
          $ref: "#/components/schemas/DeclaredActor"
        occurredAt:
          type: string
          format: date-time
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - boardId
        - type
        - previousTeamId
        - teamId
        - actor
        - occurredAt
        - deletedAt
      additionalProperties: false
