      description: Listagem limitada ao board do path, inclusive tasks filhas de outro board. parentId
        filtra filhos diretos dentro deste board. Para checklist completo cross-board usar GET
        /tasks?parentId=...; informações de tasks disponíveis a todos.
      x-contract-status: proposed
      parameters:
        - name: title
          in: query
          required: false
          description: Substring literal case-insensitive em title da tarefa. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: statusId
          in: query
          required: false
          description: Um único status pertencente ao board.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: executorAgentId
          in: query
          required: false
          description: Um único responsável atual.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: parentId
          in: query
          required: false
          description: Somente filhos diretos deste pai no board.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: rootOnly
          in: query
          required: false
          description: True é incompatível com parentId; false sem parentId inclui raízes e subtarefas.
          schema:
            type: boolean
            default: false
        - name: blocked
          in: query
          required: false
          description: ""
          schema:
            type: boolean
        - name: archived
          in: query
          required: false
          description: "False: ativos; true: arquivados, inclusive por ancestral arquivado. Aplicado antes do
            total."
          schema:
            type: boolean
            default: false
        - name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: updatedFrom
          in: query
          required: false
          description: Limite inferior inclusivo de updatedAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Limite superior exclusivo de updatedAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
