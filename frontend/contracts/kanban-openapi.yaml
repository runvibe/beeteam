                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
    post:
      operationId: createStatus
      summary: Criar status ao fim
      description: "Política de uso proposta: usuário configura o board. Contexto declarado, não
        identidade verificada. Máximo 50 status ativos; ao menos um ativo não final. Nome ativo
        único sem distinção de caixa/espaços externos."
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: Criar status ao fim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                id: 10000000-0000-7000-8000-000000000020
                boardId: 10000000-0000-7000-8000-000000000001
                name: A fazer
                isDone: false
                position: 0
                archivedAt: null
                version: 1
                deletedAt: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "Referência URI ao recurso criado. Recursos sem rota de detalhe usam URL da coleção com
                fragmento #UUID; não implica nova rota."
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusInput"
