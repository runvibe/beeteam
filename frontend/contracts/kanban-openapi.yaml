        lógica: preencher deleted_at no registro de arquivo/imagem, preservar bytes e dados físicos,
        registrar evento. Limpar somente o vínculo atual quando aplicável; archivedAt não é
        exclusão. Repetição retorna 404 para recurso já excluído."
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "204":
          description: Remover acesso ao anexo e preservar registro excluído logicamente
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/tasks/{taskId}/timeline:
    parameters:
      - name: taskId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    get:
      operationId: getTimeline
      summary: Consultar timeline unificada
      description: Timeline disponível a todos. includeChildren=true reúne toda a descendência recursiva,
        inclusive cross-board, sem limite fixo de níveis; preservar taskId/autor de cada evento, sem
        duplicação. Ordenar por sequence e paginar offset/limit.
      x-contract-status: proposed
      parameters:
        - name: includeChildren
          in: query
          required: false
          description: ""
          schema:
            type: boolean
            default: false
        - name: actorId
          in: query
          required: false
          description: Filtra autoria já registrada, sem definir a identidade do solicitante.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: types
          in: query
          required: false
          description: Lista CSV de tipos; OR entre tipos, AND com demais filtros.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EventType"
            minItems: 1
            uniqueItems: true
          style: form
          explode: false
        - name: occurredFrom
          in: query
          required: false
          description: Limite inferior inclusivo de occurredAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: occurredBefore
          in: query
          required: false
          description: Limite superior exclusivo de occurredAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - sequence
            default: sequence
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Consultar timeline unificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/tasks/{taskId}/archive:
    parameters:
      - name: taskId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    put:
      operationId: archiveTask
      summary: Arquivar ou restaurar tarefa
      description: Arquivar pai bloqueia mutações dos filhos.
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Arquivar ou restaurar tarefa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 10000000-0000-7000-8000-000000000002
                boardId: 10000000-0000-7000-8000-000000000001
                parentId: null
                title: Task 2
                description: Trabalho com autor e executor
                authorAgentId: 10000000-0000-7000-8000-000000000010
                executorAgentId: 10000000-0000-7000-8000-000000000013
                statusId: 10000000-0000-7000-8000-000000000021
                position: a2
                currentSummary: ""
                progress:
                  percent: 0
                  note: ""
                block:
                  blocked: false
                  reason: null
                childSummary:
                  total: 1
                  done: 0
                latestExecutionSummaryId: null
                archivedAt: null
                version: 1
                createdAt: 2026-10-27T20:00:00Z
                updatedAt: 2026-10-27T20:00:00Z
                deletedAt: null
                autonomyMode: automatic
                executionContext:
                  rootTaskId: 10000000-0000-7000-8000-000000000002
                  originBoardId: 10000000-0000-7000-8000-000000000001
                  originBoardMode: standard
                  effectiveMode: automatic
          headers:
            ETag:
              schema:
                type: string
              description: Versão da entidade retornada; ExecutionResult usa Task, StatusOrderResult usa Board.
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "428":
          $ref: "#/components/responses/428"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Archive"
  /api/v1/tasks:
    parameters: []
    get:
      operationId: listAllTasks
      summary: Listar tasks entre boards e consultar filhos recursivos
      description: Consulta de tasks entre boards; parentId retorna filhos diretos sem limitar board.
        Repetir para cada nó sem limite fixo de níveis. boardId é filtro opcional; não usar esse
        filtro para ocultar filhos cross-board no checklist. Informações disponíveis a todos.
      x-contract-status: proposed
      parameters:
        - name: boardId
          in: query
          required: false
          schema: *a1
        - name: title
          in: query
          required: false
          description: Substring literal case-insensitive em title da tarefa. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: statusId
          in: query
          required: false
          description: Um único status pertencente ao board.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: executorAgentId
          in: query
          required: false
          description: Um único responsável atual.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: parentId
          in: query
          required: false
          description: Somente filhos diretos deste pai no board.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: rootOnly
          in: query
          required: false
          description: True é incompatível com parentId; false sem parentId inclui raízes e subtarefas.
          schema:
            type: boolean
            default: false
        - name: blocked
          in: query
          required: false
          description: ""
          schema:
            type: boolean
        - name: archived
          in: query
          required: false
          description: "False: ativos; true: arquivados, inclusive por ancestral arquivado. Aplicado antes do
            total."
          schema:
            type: boolean
            default: false
        - name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: updatedFrom
          in: query
          required: false
          description: Limite inferior inclusivo de updatedAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Limite superior exclusivo de updatedAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - position
              - createdAt
              - updatedAt
              - title
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: authorAgentId
          in: query
          required: false
          schema: *a1
          description: Autor/dono imutável.
      responses:
        "200":
          description: Listar tarefas e subtarefas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag forte da entidade alvo; em comandos de conteúdo, da tarefa; em ordenação de
        status, do board.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        examples:
          - '"1"'
    ParentIfMatch:
      name: If-Match
      in: header
      required: false
      description: "Obrigatório se parentId não nulo: ETag do pai. Ausência retorna 428."
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retry por 24h vinculado a rota, contexto de autoria declarado e hash do pedido. Mesma
        chave/conteúdo retorna resposta original; conteúdo diferente dá 409.
      schema:
        type: string
        format: uuid
        description: Chave de requisição, não ID de entidade persistida; qualquer versão UUID.
    Limit:
      name: limit
      in: query
      required: false
      description: Máximo de itens na página; valores fora do intervalo são rejeitados, não truncados.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Offset além do total retorna items vazio.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    ActorKind:
      name: X-Actor-Kind
      in: header
      required: true
      schema:
        type: string
        enum:
          - human
          - agent
      description: Autoria declarada; sem autenticação ou prova de identidade.
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      description: UUID v7 do agente declarado quando actorKind=agent; ausente com human. Não é prova de
        identidade. Em criação de task, authorAgentId é obrigatório separadamente.
  responses:
    "400":
      description: invalid_request; invalid_actor_context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflito estrutural, versão em composição, recurso arquivado/em uso, idempotência ou
        contexto de execução incompatível; não autenticação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "412":
      description: version_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "413":
      description: payload_too_large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "415":
      description: unsupported_media_type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "428":
      description: version_required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: internal_error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: storage_unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CurrentSummary:
      type: string
      x-maxBytes: 16384
      description: Síntese cumulativa atual escrita pelo colaborador (feito, trabalho atual e pendências/próximo passo). Vazio significa ainda não informado. Nunca inferida da descrição, nota de progresso ou histórico.
    CurrentSummaryInput:
      type: string
      minLength: 1
      pattern: '\S'
      x-maxBytes: 16384
      description: Síntese cumulativa completa, não vazia, substitui a atual preservando a anterior na timeline. Não é um delta ou transcrição.
    Progress:
      type: object
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        note:
          type: string
          description: Markdown, máximo 65536 bytes UTF-8.
          x-maxBytes: 65536
      required:
        - percent
        - note
      additionalProperties: false
    Block:
      oneOf:
        - type: object
          properties:
            blocked:
              const: true
            reason:
              type: string
              minLength: 1
              maxLength: 2000
          required:
            - blocked
            - reason
          additionalProperties: false
        - type: object
          properties:
            blocked:
              const: false
            reason:
              type: "null"
          required:
            - blocked
            - reason
          additionalProperties: false
    CoordinationContext:
      oneOf:
        - type: object
          properties:
            mode:
              const: manual
            conversationRef:
              type: string
              minLength: 1
            approvalRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
            - approvalRef
          additionalProperties: false
        - type: object
          properties:
            mode:
              const: automatic
            conversationRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
          additionalProperties: false
      description: mode deve corresponder ao modo efetivo do contexto da execução. Manual exige referência
        à aprovação; automatic não pede nova aprovação de coordenação no escopo. Referências não são
        autenticação.
    ReviewContext:
      type: object
      properties:
        reviewerType:
          type: string
          enum:
            - user
            - team_leader
        conversationRef:
          type: string
          minLength: 1
        instructionRef:
          type: string
          minLength: 1
      required:
        - reviewerType
        - conversationRef
        - instructionRef
      additionalProperties: false
      description: Orientação de revisão na conversa; não prova consentimento por si só.
    Deliverable:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        attachmentId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        url:
          type: string
          format: uri
          pattern: ^https?://
      required:
        - label
      additionalProperties: false
      not:
        required:
          - attachmentId
          - url
    Board:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Markdown, máximo 65536 bytes UTF-8.
          x-maxBytes: 65536
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
          description: "Exclusão lógica: corresponde a deleted_at no PostgreSQL; não remove dados físicos."
        autonomyMode:
          $ref: "#/components/schemas/BoardAutonomyMode"
        createdBy:
          $ref: "#/components/schemas/DeclaredActor"
        teamId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Time gestor do board; pode mudar sem alterar criador, tasks, executores, hierarquia ou
            histórico.
        lastManagementChange:
          oneOf:
            - $ref: "#/components/schemas/BoardManagementChange"
            - type: "null"
          description: Último evento de transferência; log completo append-only preservado. Null antes da
            primeira transferência.
      required:
        - id
        - name
        - description
        - archivedAt
        - version
        - createdAt
        - updatedAt
        - deletedAt
        - autonomyMode
        - createdBy
        - teamId
        - lastManagementChange
      additionalProperties: false
    Status:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        boardId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        isDone:
          type: boolean
        position:
          type: integer
          minimum: 0
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
          minimum: 1
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
          description: "Exclusão lógica: corresponde a deleted_at no PostgreSQL; não remove dados físicos."
      required:
        - id
        - boardId
        - name
        - isDone
        - position
        - archivedAt
        - version
        - deletedAt
      additionalProperties: false
    BoardCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Markdown, máximo 65536 bytes UTF-8.
          x-maxBytes: 65536
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/Status"
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
          description: "Exclusão lógica: corresponde a deleted_at no PostgreSQL; não remove dados físicos."
        autonomyMode:
          $ref: "#/components/schemas/BoardAutonomyMode"
        createdBy:
          $ref: "#/components/schemas/DeclaredActor"
        teamId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Time gestor do board; pode mudar sem alterar criador, tasks, executores, hierarquia ou
            histórico.
        lastManagementChange:
          oneOf:
            - $ref: "#/components/schemas/BoardManagementChange"
            - type: "null"
          description: Último evento de transferência; log completo append-only preservado. Null antes da
            primeira transferência.
      required:
        - id
        - name
        - description
        - archivedAt
        - version
        - createdAt
        - updatedAt
        - statuses
        - deletedAt
        - autonomyMode
        - createdBy
        - teamId
        - lastManagementChange
      additionalProperties: false
    StatusInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        isDone:
          type: boolean
          default: false
      required:
        - name
      additionalProperties: false
    CreateBoard:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Markdown, máximo 65536 bytes UTF-8.
          x-maxBytes: 65536
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/StatusInput"
          minItems: 1
          maxItems: 50
        autonomyMode:
          $ref: "#/components/schemas/BoardAutonomyMode"
        teamId:
          type: string
          format: uuid
