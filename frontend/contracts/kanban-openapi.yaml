        interno). Demais parâmetros são escalares: repetidos ou desconhecidos retornam 400. UUID,
        enum, faixa de datas e números inválidos retornam 400 invalid_request. Ordenação estável com
        desempate id; sem snapshot entre requisições."
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive em name do status. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
