            type: boolean
        - name: includeArchived
          in: query
          required: false
          description: "False: somente ativos; true: ativos e arquivados."
          schema:
            type: boolean
            default: false
        - name: sortBy
          in: query
          required: false
          description: Campo da allowlist; desempate obrigatório por id na mesma direção.
          schema:
            type: string
            enum:
              - position
              - name
            default: position
        - name: sortOrder
          in: query
          required: false
          description: Direção do campo principal e do desempate por id.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
