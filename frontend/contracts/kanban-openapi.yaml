  /api/v1/boards/{boardId}/view:
    parameters:
      - name: boardId
        in: path
        required: true
        description: ""
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    get:
      operationId: getBoardView
      summary: Consultar quadro
      description: Projeção por board, todas as colunas ativas visíveis, cards raiz locais em position,id
        asc. limitPerColumn default20 max100. Task filha em outro board continua acessível na
        listagem e checklist global; filtros locais não definem contexto de execução. Cada card traz
        autor/executor, currentSummary e executionContext. Continuação via listagem do board com statusId/rootOnly e
        mesmos filtros.
      x-contract-status: proposed
      parameters:
        - name: title
          in: query
          required: false
          description: Substring literal case-insensitive em title da tarefa. Percentual, underscore e barra
            invertida são caracteres literais; não são wildcards, regex ou SQL. Valor vazio
            rejeitado.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: executorAgentId
          in: query
          required: false
          description: Um único responsável atual.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: blocked
          in: query
          required: false
          description: ""
          schema:
            type: boolean
        - name: createdFrom
          in: query
          required: false
          description: Limite inferior inclusivo de createdAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Limite superior exclusivo de createdAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: updatedFrom
          in: query
          required: false
          description: Limite inferior inclusivo de updatedAt, RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Limite superior exclusivo de updatedAt, RFC3339 com timezone. From deve ser
            estritamente anterior a Before.
          schema:
            type: string
            format: date-time
        - name: limitPerColumn
          in: query
          required: false
          description: Não pagina nem esconde colunas.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Consultar quadro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardView"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/boards/{boardId}/tasks:
    parameters:
      - name: boardId
        in: path
        required: true
