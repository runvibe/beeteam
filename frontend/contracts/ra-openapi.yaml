            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: title
          in: query
          required: false
          description: Substring literal case-insensitive; %, _ e barra invertida não são wildcards.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: statusId
          in: query
          required: false
          description: Status atual da tarefa; exige boardId para validar pertencimento.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: relation
          in: query
          required: false
          description: "authored: autor/dono; executing: executor atual; worked: autor declarado de resumo;
            any: união sem duplicar taskId."
          schema:
            type: string
            enum:
              - authored
              - executing
              - worked
              - any
            default: any
        - name: archived
          in: query
          required: false
          description: Estado da tarefa, incluindo ancestral arquivado.
          schema:
            type: boolean
            default: false
        - name: updatedFrom
          in: query
          required: false
          description: Inclusivo; RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Exclusivo; From deve ser anterior a Before.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: sortBy
          in: query
          required: false
          description: ""
          schema:
            type: string
            enum:
              - taskUpdatedAt
              - title
            default: taskUpdatedAt
        - name: sortOrder
          in: query
          required: false
          description: Desempate taskId na mesma direção.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: Consultar índice de tarefas e resumos do agente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLinkPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
  /api/v1/agents/{agentId}/latest-activity:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    get:
      operationId: getAgentLatestActivity
      summary: Read the latest recorded task activity attributed to an agent
      description: Returns the latest persisted task timeline event whose actorKind is agent and actorId matches this agent. Orders by occurredAt instant descending (including subsecond precision), then sequence and eventId descending. Includes archived tasks and boards, excludes deleted events, tasks and boards. Task authorship, assignment and profile/task updatedAt do not imply event authorship. Returns activity null only when no eligible event exists; missing/deleted agent is 404 and infrastructure failures remain errors. Reads at most one result within a consistent database snapshot. summaryId is the explicit execution.recorded reference when its summary still exists on the same task. Task slug/title are current metadata. No current team membership restriction or online status is inferred.
      responses:
        "200":
          description: Latest attributed activity or an explicit absence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLatestActivity"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: ""
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag forte do recurso alvo (agente, time ou referência de chat). Cópia usa versão da
        origem; imagem usa versão do agente.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        examples:
          - '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retry por 24h vinculado a rota, contexto de autoria declarado e hash do pedido. Mesma
        chave/conteúdo retorna resposta original; conteúdo diferente dá 409.
      schema:
        type: string
        format: uuid
        description: Chave de requisição, não ID de entidade persistida; qualquer versão UUID.
    Offset:
      name: offset
      in: query
      required: false
      description: ""
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    ActorKind:
      name: X-Actor-Kind
      in: header
      required: true
      schema:
        type: string
        enum:
          - human
          - agent
      description: Autoria declarada; sem autenticação ou prova de identidade.
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      description: UUID v7 do agente declarado quando actorKind=agent; ausente com human. Não é prova de
        identidade. Em criação de task, authorAgentId é obrigatório separadamente.
  responses:
    "400":
      description: invalid_request; invalid_composition; invalid_actor_context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflito estrutural, versão em composição, recurso arquivado/em uso, idempotência ou
        contexto de execução incompatível; não autenticação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "412":
      description: version_conflict; version_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "413":
      description: payload_too_large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "415":
      description: unsupported_media_type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "428":
      description: version_required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: internal_error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: storage_unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AgentLatestActivity: {"type": "object", "properties": {"activity": {"type": ["object", "null"], "properties": {"type": {"type": "string", "description": "Persisted task timeline EventType; translate this identifier for display."}, "occurredAt": {"type": "string", "format": "date-time"}, "taskId": {"type": "string", "format": "uuid"}, "taskSlug": {"type": "string"}, "taskTitle": {"type": "string"}, "eventId": {"type": "string", "format": "uuid"}, "summaryId": {"type": ["string", "null"], "format": "uuid"}}, "required": ["type", "occurredAt", "taskId", "taskSlug", "taskTitle", "eventId", "summaryId"], "additionalProperties": false}}, "required": ["activity"], "additionalProperties": false}
    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: Identificador de URL gerado, ASCII lowercase, estável ao renomear, único por tipo inclusive excluídos. Colisões usam -2/-3; não aceita escrita pelo cliente.
    SlugResolution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        slug:
          $ref: '#/components/schemas/Slug'
      required: [id, slug]
      additionalProperties: false
    CoordinationContext:
      oneOf:
        - type: object
          properties:
            mode:
              const: manual
            conversationRef:
              type: string
              minLength: 1
            approvalRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
            - approvalRef
          additionalProperties: false
        - type: object
          properties:
            mode:
              const: automatic
            conversationRef:
              type: string
              minLength: 1
          required:
            - mode
            - conversationRef
          additionalProperties: false
      description: mode deve corresponder ao modo efetivo do contexto da execução. Manual exige referência
        à aprovação; automatic não pede nova aprovação de coordenação no escopo. Referências não são
        autenticação.
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - coordination_context_required
            - coordination_mode_mismatch
            - not_found
            - archived_resource
            - status_in_use
            - team_in_use
            - summary_required
            - task_blocked
            - revision_conflict
            - idempotency_conflict
            - duplicate_status
            - version_conflict
            - version_required
            - payload_too_large
            - unsupported_media_type
            - internal_error
            - storage_unavailable
            - invalid_composition
            - role_cardinality_conflict
            - same_team_roles
            - leader_required
            - leadership_cycle
            - agent_in_use
            - assignment_in_use
            - composition_conflict
            - invalid_actor_context
            - usage_policy_conflict
        details:
          type: object
          additionalProperties: true
