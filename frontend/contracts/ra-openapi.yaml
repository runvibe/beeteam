openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Bee Team RA — contrato proposto
  version: 0.1.0-draft
  description: Revisão documental final. Domínio boards, tasks, times e agentes. Board tem um time
    gestor obrigatório e transferível; Task não tem vínculo direto com time. Times agrupam agentes e
    podem gerir vários boards. Board preserva criador declarado; Task tem autor/dono e executor
    agentes obrigatórios, sem task desatribuída. Subtask é Task com parentId recursivo sem limite
    fixo, pode estar em outro board e usar outro executor; ciclos inválidos. Informações de tasks
    disponíveis a todos. Contexto é o board que originou a task principal, preservado por toda a
    cadeia recursiva, mesmo em outros boards. Origem manual força manual; origem automatic força
    automatic; origem standard usa somente autonomyMode da task atual, sem herança da flag do pai.
    Board de destino não interfere. Cálculo não altera configurações persistidas; Bee Team não
    executa tarefas. Sem autenticação, autoria declarada não verificada. Backend Rust/PostgreSQL
    >=18; IDs persistidos UUID v7, referências externas opacas; exclusão lógica deleted_at/JSON
    deletedAt, archivedAt separado. offset/limit e filtros. Harness executa, Bee Team
    armazena/consulta; frontend/backend/skills seguem pausados nesta revisão.
  x-confirmed-decisions:
    - board-creator-preserved
    - task-author-and-executor-required
    - recursive-cross-board-subtasks
    - execution-origin-board-precedence
    - no-auth
    - postgresql>=18
    - persisted-uuidv7
    - soft-delete-deleted_at
    - offset-limit
    - archived-team-explicit-transfer
    - board-managing-team-required-transferable
    - task-no-team-ownership
  x-pending-proposals:
    - leader-edit-scope-via-managed-executor
    - declared-author-header-format
    - reparenting-not-exposed
    - archive-agent-rules
    - planning-revisions-and-payload-limits
servers:
  - url: http://127.0.0.1:59865
    description: Endereço local proposto; não comprova API implementada.
paths:
  /api/v1/teams/by-slug/{slug}:
    get:
      operationId: resolveTeamSlug
      summary: Resolver slug de Team para UUID interno
      description: Consulta indexada sem enumerar listagens. Retorna identidade canônica; buscar detalhes na rota por UUID existente. Arquivados resolvem, excluídos retornam 404. Não redireciona nem reutiliza slugs.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: Identidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugResolution'
        '400':
          description: Slug inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identidade não encontrada ou excluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/by-slug/{slug}:
    get:
      operationId: resolveAgentSlug
      summary: Resolver slug de Agent para UUID interno
      description: Consulta indexada sem enumerar listagens. Retorna identidade canônica; buscar detalhes na rota por UUID existente. Arquivados resolvem, excluídos retornam 404. Não redireciona nem reutiliza slugs.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: Identidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugResolution'
        '400':
          description: Slug inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identidade não encontrada ou excluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents:
    parameters: []
    post:
      operationId: createAgent
      summary: Criar perfil único sem vínculo
      description: "Política de uso proposta: usuário administra perfis e composição."
      x-contract-status: proposed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorKind"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: Criar perfil único sem vínculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
              example:
                id: 10000000-0000-7000-8000-000000000010
                name: Carlos
                roleDescription: Engenharia
                workStyle: Objetivo
                workInstructions: Registrar resultado na task
                rules: []
                accessLimits: []
                contextSummary: ""
                image: null
                bindings:
                  collaboratorTeamId: 10000000-0000-7000-8000-000000000030
                  leaderTeamId: 10000000-0000-7000-8000-000000000031
                archivedAt: null
                version: 1
                createdAt: 2026-10-27T20:00:00Z
                updatedAt: 2026-10-27T20:00:00Z
                slug: example-agent
                deletedAt: null
          headers:
            ETag:
              schema:
                type: string
              description: Versão do recurso retornado; CopyResult usa agente novo.
            Location:
              schema:
                type: string
                format: uri-reference
              description: "URI do recurso criado; referência de chat usa coleção com #id, sem criar GET
                adicional."
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgent"
            example:
              name: Carlos
    get:
      operationId: listAgents
      summary: Listar agentes
      description: Leitura local sem autenticação; aplicar filtros e exclusão lógica.
      x-contract-status: proposed
      parameters:
        - name: name
          in: query
          required: false
          description: Substring literal case-insensitive; %, _ e barra invertida não são wildcards.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: teamId
          in: query
          required: false
          description: Vínculo atual em qualquer papel ou no role especificado.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        - name: role
          in: query
          required: false
          description: Com teamId filtra papel nesse time; sem teamId exige algum vínculo nesse papel.
          schema:
            type: string
            enum:
              - leader
              - collaborator
        - name: archived
          in: query
          required: false
          description: "False: ativos; true: arquivados. Lifecycle, não execução."
          schema:
            type: boolean
            default: false
        - name: createdFrom
          in: query
          required: false
          description: Inclusivo; RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          required: false
          description: Exclusivo; From deve ser anterior a Before.
          schema:
            type: string
            format: date-time
        - name: updatedFrom
          in: query
          required: false
          description: Inclusivo; RFC3339 com timezone.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Exclusivo; From deve ser anterior a Before.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: sortBy
          in: query
          required: false
          description: ""
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: Desempate id na mesma direção.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: Listar agentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
              example:
                items: []
                offset: 0
                limit: 50
                total: 0
                hasMore: false
                nextOffset: null
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
