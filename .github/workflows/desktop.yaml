name: Desktop installers
on:
  pull_request:
    paths: ['desktop/**', 'scripts/*desktop*', 'src/main.rs', '.github/workflows/desktop.yaml']
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: node scripts/build-distribution.mjs
      - run: python scripts/stage-desktop.py
      - run: cargo test --manifest-path desktop/Cargo.toml --locked
      - working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.11.2 build --bundles ${{ matrix.bundles }} -- --locked
      - run: python scripts/check-desktop-installer.py desktop/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bee-team-desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/deb/*.deb

