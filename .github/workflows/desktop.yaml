name: Desktop installers
on:
  pull_request:
    paths: ['desktop/**', 'scripts/*desktop*', 'src/main.rs', '.github/workflows/desktop.yaml']
  workflow_dispatch:
  push:
    tags: ['v*']
env:
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 apt-utils
      - run: node scripts/build-distribution.mjs
      - run: cargo test --locked --lib repositories::local_projects
      - run: python scripts/stage-desktop.py
      - run: cargo test --manifest-path desktop/Cargo.toml --locked
      - working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.11.2 build --bundles ${{ matrix.bundles }} -- --locked
      - run: python scripts/check-desktop-installer.py desktop/target/release/bundle
      - name: Prepare checksum and candidate package metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/channel
          version=$(python -c "import tomllib; print(tomllib.load(open('desktop/Cargo.toml','rb'))['package']['version'])")
          case "$RUNNER_OS" in
            Windows) assets=(desktop/target/release/bundle/nsis/*.exe) ;;
            macOS) assets=(desktop/target/release/bundle/dmg/*.dmg) ;;
            Linux) assets=(desktop/target/release/bundle/deb/*.deb) ;;
          esac
          test "${#assets[@]}" = 1
          asset=${assets[0]}
          python -c "from pathlib import Path; import hashlib,sys; p=Path(sys.argv[1]); print(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name)" "$asset" > desktop/channel/SHA256SUMS
          if test "$RUNNER_OS" = Linux; then
            export GNUPGHOME="$RUNNER_TEMP/bee-qa-gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --passphrase '' --quick-generate-key 'Bee Desktop CI <ci@example.invalid>' ed25519 sign 1d
            fingerprint=$(gpg --with-colons --list-keys | awk -F: '$1=="fpr"{print $10; exit}')
            bash scripts/desktop-apt-repository.sh "$asset" "$RUNNER_TEMP/apt-qa" "$fingerprint"
          else
            arch=x64
            if test "$RUNNER_ARCH" = ARM64; then arch=arm64; fi
            python scripts/desktop-channel-metadata.py "$asset" --version "$version" --arch "$arch" --output desktop/channel
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bee-team-desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/deb/*.deb
            desktop/channel/*
