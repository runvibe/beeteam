name: Application artifact
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'deploy/app/**'
      - 'scripts/build-cloudflare-app.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'docs/team-role-icons.json'
      - 'docs/mcp-catalog.json'
      - 'Cargo.toml'
      - '.github/workflows/application.yaml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build:embedded
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: frontend/dist/
          include-hidden-files: true
          if-no-files-found: error
      - run: npm ci
      - run: npm run test:worker
      - run: npm run build
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-app
          path: .local/cloudflare/app/
          if-no-files-found: error
